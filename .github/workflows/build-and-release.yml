name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 验证 Go 版本
        run: go version

      - name: 获取构建元信息
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi
          VERSION="$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "构建版本: $VERSION"

      - name: 编译 Windows 二进制
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-H windowsgui -s -w -X main.version=$VERSION" \
            -o audio.cpp-hub.exe .
          ls -lh audio.cpp-hub.exe

      - name: 编译 Linux 二进制
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=$VERSION" \
            -o audio.cpp-hub .
          ls -lh audio.cpp-hub

      - name: 打包
        id: package
        run: |
          mkdir -p dist
          make_zip() {
            local root_name="$1"
            local zip_name="$2"
            mkdir -p "$root_name/audiocpp"
            zip -r -9 -X "dist/$zip_name" "$root_name"
          }
          # Windows 包
          WIN_ROOT="audio.cpp-hub-${VERSION}-windows"
          mkdir -p "$WIN_ROOT"
          cp audio.cpp-hub.exe "$WIN_ROOT/"
          cp -r web "$WIN_ROOT/web"
          cp README.md "$WIN_ROOT/"
          make_zip "$WIN_ROOT" "audio.cpp-hub-${VERSION}-windows.zip"
          # Linux 包
          LINUX_ROOT="audio.cpp-hub-${VERSION}-linux"
          mkdir -p "$LINUX_ROOT"
          cp audio.cpp-hub "$LINUX_ROOT/"
          cp -r web "$LINUX_ROOT/web"
          cp README.md "$LINUX_ROOT/"
          chmod +x "$LINUX_ROOT/audio.cpp-hub"
          make_zip "$LINUX_ROOT" "audio.cpp-hub-${VERSION}-linux.zip"
          ls -lh dist/

      - name: 生成 Release Notes
        id: release_notes
        run: |
          # 获取最新的 commit 信息
          LATEST_COMMIT=$(git log -1 --pretty=format:"%h - %s (%an, %ar)")

          # 获取自上一个 tag 以来的所有 commit
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS_SINCE_TAG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS_SINCE_TAG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi

          LINUX_ZIPS=$(ls dist/*linux*.zip 2>/dev/null || true)
          WINDOWS_ZIPS=$(ls dist/*windows*.zip 2>/dev/null || true)
          cat > release_notes.md << 'EOF'
          ## 🚀 Release Notes

           > ⚠️ **重要提示**：更新前请备份 `data/` 目录（上传的音频和音色库）。
           >
           > ⚠️ **IMPORTANT**: Please back up the `data/` directory (uploaded audio and voice library) before upgrading.

           ### 📦 原生单二进制（无需 Java/JRE）
          - 自本版起 hub 改为 Go 原生实现，解压即跑，无需安装任何运行环境
          - 原 Java 版已归档到源码仓库的 `legacy/` 目录，不再维护

          ### 🧩 audio.cpp 说明
          - 发布包不包含 audio.cpp 二进制，请自行从 audio.cpp 项目的 Release 下载后放入 `audiocpp/` 目录（最新版本发布页：https://github.com/0xShug0/audio.cpp/releases/latest），并在 Web UI 中登记可执行文件
          EOF
          echo "" >> release_notes.md
          echo "### 📦 可用版本" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Windows:**" >> release_notes.md
          if [ -n "$WINDOWS_ZIPS" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && echo "- \`$(basename "$f")\`" >> release_notes.md
            done <<< "$WINDOWS_ZIPS"
          else
            echo "- 无" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "**Linux:**" >> release_notes.md
          if [ -n "$LINUX_ZIPS" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && echo "- \`$(basename "$f")\`" >> release_notes.md
            done <<< "$LINUX_ZIPS"
          else
            echo "- 无" >> release_notes.md
          fi
          cat >> release_notes.md << 'EOF'

          ### 📝 使用方法

          **Windows:**
          ```cmd
          解压 zip，双击 audio.cpp-hub.exe（无控制台窗口，进入系统托盘）
          ```

          **Linux:**
          ```bash
          unzip <你下载的 linux zip 包>
          cd <解压后的目录>
          ./audio.cpp-hub
          ```

          启动后浏览器打开 http://localhost:8080（端口见 hub.config.json 的 httpPort）。

          **注意：**
          - **升级前请先备份 `data/` 目录**。
          - **Back up the `data/` directory before upgrading.**
          - 原生单二进制，无需安装 Java/JRE 等任何运行环境。
          - **安全警告：** 本应用为局域网工具，不具备互联网安全防护能力。请勿将服务端口直接暴露到公网。如需远程访问，请使用反向代理 + HTTPS。

          ---
          ### 📌 最新提交
          EOF

          echo "$LATEST_COMMIT" >> release_notes.md
          echo "" >> release_notes.md

          # 添加提交详情
          if [ -n "$COMMITS_SINCE_TAG" ]; then
            echo "### 📋 自上次发布以来的变更" >> release_notes.md
            echo "" >> release_notes.md
            echo "$COMMITS_SINCE_TAG" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*构建时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*" >> release_notes.md

          # 输出内容供调试
          echo "生成的 Release Notes:"
          cat release_notes.md

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: audio.cpp-hub-${{ steps.get_version.outputs.version }}
          path: |
            dist/*.zip
            release_notes.md
          retention-days: 30
